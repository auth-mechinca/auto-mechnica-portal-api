# Local development database only.
#
# Production Postgres runs directly on the VPS, alongside the persistent Express
# process — that is the whole point of the hosting decision. This file exists so a
# developer gets an identical Postgres locally without installing one.
#
# The tests do not need this: they run against PGlite in-process.

services:
  postgres:
    image: postgres:17-alpine
    container_name: auto-mechanica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_mechanica}
      # The container superuser is the migration role: it owns the schema and is
      # the only account with DDL rights.
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-auto_mechanica_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-migrator_dev_only}
      # The API's own least-privilege role, created by the init script below.
      APP_DB_USER: ${POSTGRES_APP_USER:-auto_mechanica_app}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_dev_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory. `npm run db:reset` is what
      # re-triggers it, because it drops the volume.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_MIGRATION_USER:-auto_mechanica_migrator} -d ${POSTGRES_DB:-auto_mechanica}',
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
